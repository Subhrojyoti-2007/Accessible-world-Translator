<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - Accessible World Translator</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: { 50: '#fdf7f4', 100: '#fbece5', 200: '#f8d8ca', 500: '#e25c26', 600: '#d85a2a', 700: '#b8461b' },
                        canvas: { DEFAULT: '#f3efe6', warm: '#f7f5f0', border: '#e4dfd3', card: '#ffffff' },
                        ink: { DEFAULT: '#11100f', muted: '#68655e', light: '#8e8b83' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3efe6; color: #11100f; }
        /* Terminal styling override for the light theme */
        #logs {
            background-color: #11100f;
            color: #4ade80;
        }
    </style>
</head>
<body class="min-h-screen bg-canvas flex flex-col">
    <!-- Navbar -->
    <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-2">
        <nav class="flex items-center justify-between h-16 bg-white/60 backdrop-blur rounded-2xl px-6 border border-canvas-border shadow-sm">
            <a class="flex items-center gap-2.5 group" href="/">
                <div class="flex items-end gap-1 h-6 w-6">
                    <span class="w-1.5 h-6 bg-brand-600 rounded-full"></span>
                    <span class="w-1.5 h-4 bg-brand-600/85 rounded-full"></span>
                    <span class="w-1.5 h-5 bg-brand-600 rounded-full"></span>
                </div>
                <span class="font-extrabold text-xl tracking-tight text-ink">MostTranslate</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-sm font-medium px-4 py-2 text-ink-muted hover:text-ink bg-white/50 hover:bg-white rounded-full transition-colors border border-canvas-border">
                    Back to Dashboard
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Media Capture Section -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl flex flex-col gap-6 border border-canvas-border shadow-sm">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold tracking-tight text-ink flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse hidden" id="recordingIndicator"></span>
                    Live Feed
                </h2>
                <div id="statusBadge" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-canvas-warm text-ink-muted border border-canvas-border uppercase tracking-wider">DISCONNECTED</div>
            </div>

            <!-- Video feed -->
            <div class="relative w-full aspect-square bg-canvas-warm rounded-2xl overflow-hidden border border-canvas-border flex items-center justify-center shadow-inner">
                <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
                <div id="camera-placeholder" class="text-ink-light flex flex-col items-center gap-3">
                    <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-sm border border-canvas-border">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-sm font-medium">Camera inactive</span>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button id="startBtn" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white py-3.5 rounded-2xl font-bold shadow-sm shadow-brand-600/20 transition-all active:scale-[0.98]">
                    Start Streaming
                </button>
                <button id="analyzeBtn" class="flex-1 bg-ink hover:bg-ink-muted text-white py-3.5 rounded-2xl font-bold shadow-sm transition-all active:scale-[0.98] hidden">
                    Force Analysis
                </button>
                <button id="stopBtn" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 py-3.5 rounded-2xl font-bold transition-all active:scale-[0.98] hidden">
                    Stop Stream
                </button>
            </div>
        </div>

        <!-- Feedback & Logs Section -->
        <div class="flex flex-col gap-6">
            <div class="bg-white p-6 sm:p-8 rounded-3xl border border-canvas-border shadow-sm">
                <h2 class="text-xl font-bold tracking-tight text-ink mb-6">System Diagnostics</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-2">
                    <div class="bg-canvas-warm p-4 rounded-2xl border border-canvas-border/50">
                        <div class="text-xs font-semibold text-ink-muted mb-1 uppercase tracking-wider">Visual Throttling</div>
                        <div class="font-medium text-sm text-ink">1 FPS @ 768x768</div>
                    </div>
                    <div class="bg-canvas-warm p-4 rounded-2xl border border-canvas-border/50">
                        <div class="text-xs font-semibold text-ink-muted mb-1 uppercase tracking-wider">Audio Processing</div>
                        <div class="font-medium text-sm text-ink">PCM 16kHz in / 24kHz</div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 sm:p-8 rounded-3xl border border-canvas-border shadow-sm flex-1 flex flex-col">
                <h2 class="text-xl font-bold tracking-tight text-ink mb-4">Event Logs</h2>
                <div id="logs" class="flex-1 p-5 rounded-2xl font-mono text-[11px] overflow-y-auto h-64 sm:h-auto border border-canvas-border/50 shadow-inner leading-relaxed">
                    [System] Initialization complete.<br>
                    [System] Waiting for user to start stream...<br>
                </div>
            </div>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
